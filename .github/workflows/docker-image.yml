name: build-and-publish

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags

      - name: Get last tag
        id: last_tag
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "last=$LAST_TAG" >> $GITHUB_OUTPUT

      - name: Compute version
        id: version
        run: |
          python3 - << 'EOF'
          import subprocess

          last_tag = "${{ steps.last_tag.outputs.last }}"

          # Normalizar versión
          last = last_tag.replace("v", "")

          # Obtener commits de forma segura (primer commit incluido)
          try:
              commits = subprocess.check_output(
                  ["git", "log", f"{last_tag}..HEAD", "--pretty=%s"]
              ).decode().splitlines()
          except subprocess.CalledProcessError:
              commits = subprocess.check_output(
                  ["git", "log", "--pretty=%s"]
              ).decode().splitlines()

          # Si no hay commits (caso extremo)
          if not commits:
              print(f"v{last}")
              exit(0)

          major, minor, patch = map(int, last.split("."))

          for c in commits:
              if "BREAKING" in c:
                  major += 1
                  minor = 0
                  patch = 0
                  break
              elif c.startswith("feat"):
                  minor += 1
              elif c.startswith("fix"):
                  patch += 1

          print(f"v{major}.{minor}.{patch}")
          EOF

      - name: Create and push tag
        run: |
          VERSION=${{ steps.version.outputs.stdout }}

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git tag $VERSION
          git push origin $VERSION

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/masterhardisk/dns-orchestration
          tags: |
            type=raw,value=latest
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max