name: build-and-publish

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags

      # =========================
      # GET LAST TAG
      # =========================
      - name: Get last tag
        id: last_tag
        shell: bash
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "last=$LAST_TAG" >> $GITHUB_OUTPUT

      # =========================
      # COMPUTE VERSION (FIXED PRIORITY LOGIC)
      # =========================
      - name: Compute version
        id: version
        shell: bash
        run: |
          python3 - << 'EOF'
          import subprocess
          import os

          last_tag = "${{ steps.last_tag.outputs.last }}"

          # Obtener commits
          commits = subprocess.check_output(
              ["git", "log", "--pretty=%s"]
          ).decode().splitlines()

          def has_breaking(commits):
              return any("BREAKING CHANGE" in c or "BREAKING" in c for c in commits)

          def has_feat(commits):
              return any(c.startswith("feat") for c in commits)

          def has_fix(commits):
              return any(c.startswith("fix") for c in commits)

          # =========================
          # BOOTSTRAP (SIN TAGS)
          # =========================
          if not last_tag:
              if has_breaking(commits):
                  version = "v1.0.0"
              elif has_feat(commits):
                  version = "v0.1.0"
              elif has_fix(commits):
                  version = "v0.0.1"
              else:
                  version = "v0.1.0"

              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write(f"version={version}\n")
              print("BOOTSTRAP:", version)
              exit(0)

          # =========================
          # NORMAL MODE
          # =========================
          last = last_tag.replace("v", "")

          commits = subprocess.check_output(
              ["git", "log", f"{last_tag}..HEAD", "--pretty=%s"]
          ).decode().splitlines()

          if not commits:
              version = f"v{last}"
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write(f"version={version}\n")
              print("NO CHANGES:", version)
              exit(0)

          major, minor, patch = map(int, last.split("."))

          # =========================
          # 🔥 PRIORIDAD CORRECTA (BREAKING ABSOLUTO)
          # =========================
          if has_breaking(commits):
              major += 1
              minor = 0
              patch = 0

          elif has_feat(commits):
              minor += 1

          elif has_fix(commits):
              patch += 1

          version = f"v{major}.{minor}.{patch}"

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"version={version}\n")

          print("COMPUTED:", version)
          EOF

      # =========================
      # CREATE TAG
      # =========================
      - name: Create and push tag
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          echo "Creating tag: $VERSION"

          if [ -z "$VERSION" ]; then
            echo "ERROR: VERSION is empty"
            exit 1
          fi

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag already exists: $VERSION"
            exit 0
          fi

          git tag "$VERSION"
          git push origin "$VERSION"

      # =========================
      # DOCKER BUILD
      # =========================
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/masterhardisk/dns-orchestration
          tags: |
            type=raw,value=latest
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max